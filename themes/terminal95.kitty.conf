# Terminal95: appearance only. Use include in kitty.conf.
font_family PxPlus IBM VGA 8x16
bold_font PxPlus IBM VGA 8x16
italic_font PxPlus IBM VGA 8x16
bold_italic_font PxPlus IBM VGA 8x16
font_size 16.0
disable_ligatures always
background #cccccc
foreground #000000
background_opacity 1.0
selection_background #aaaaaa
selection_foreground #000000
cursor #000000
cursor_text_color #cccccc
cursor_shape block
cursor_blink_interval 0

color0 #000000
color1 #800000
color2 #008000
color3 #808000
color4 #000080
color5 #800080
color6 #008080
color7 #c0c0c0
color8 #808080
color9 #ff0000
color10 #00ff00
color11 #ffff00
color12 #0000ff
color13 #ff00ff
color14 #00ffff
color15 #ffffff
